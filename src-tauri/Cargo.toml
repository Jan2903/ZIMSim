[package]
name = "zimsim"
version = "1.0.0"
description = "Simulation of a Deutsche Bahn (DB) train display (ZugInfoMonitor / ZIM)"
authors = ["ZIMSim"]
license = "ISC"
repository = "https://github.com/Jan2903/ZIMSim"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.5.9"
tauri-plugin-dialog = "2"
zip = "4.2.0"
