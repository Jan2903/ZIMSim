<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000px" height="600px">
  
  <g fill="#ffffff" stroke="none">
    
    <!-- Das Bett (Matratze mit Kopf- und Fußteil) -->
    <path d="M 100 180 V 500 H 180 V 410 H 820 V 500 H 900 V 180 H 820 V 330 H 180 V 180 Z" />

    <!-- Das Kopfkissen (links) -->
    <!-- Startet unten links, hoch, kurzes flaches Stück, weiche Kurve nach rechts unten -->
    <path d="M 210 300 V 150 H 270 C 330 150, 360 220, 360 300 Z" />

    <!-- Die Decke / Person (rechts) -->
    <!-- Startet unten links, hoch, langes flaches Stück, weiche Kurve nach rechts unten -->
    <path d="M 390 300 V 150 H 680 C 750 150, 790 220, 790 300 Z" />
    
  </g>
</svg>